<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cross Section Viewer</title>
<link rel="stylesheet" href="style.css">
<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
</head>
<body>
<div id="app">
<div id="sidebar">
<h2>Tverrprofil</h2>
<label><input type="radio" name="mode" value="point"> Punktmodus</label>
<label><input type="radio" name="mode" value="profile" checked> Profilmodus</label>
<hr>
<input id="profileName" readonly placeholder="Ingen profil valgt">
<button id="btnSelectProfile">Velg profileringslinje</button>
<hr>
<div class="stationControls">
<button id="btnBack">-5m</button>
<input type="number" id="stationInput" value="0">
<button id="btnForward">+5m</button>
</div>
<input type="range" id="stationSlider" min="0" max="1000" value="0">
<hr>
<input type="number" id="sectionWidth" value="50">
<button id="btnGenerate">Generer profil</button>
<button id="btnExportPng">PNG</button>
<button id="btnExportSvg">SVG</button>
<div id="status">Klar</div>
</div>
<div id="viewer">
<div id="profileHeader">Tverrprofil <span id="stationLabel">Stasjon 0</span></div>
<svg id="profileSvg"></svg>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
