<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interaktiv tverrprofilviser</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
</head>
<body>
<div id="app">
    <aside id="sidebar">
        <div id="titlePanel">
            <h2>Interaktiv tverrprofilviser</h2>
            <div id="versionInfo">v?.?.?</div>
            <div id="buildInfo">Build ukjent</div>
        </div>

        <div class="section">
            <button id="btnSelectProfile">Velg profileringslinje</button>
        </div>

        <div class="section">
            <label>Valgt profil</label>
            <input id="profileName" readonly placeholder="Ingen profil valgt">
            <div id="profileDetails">
                <div>ID: <span id="profileId">-</span></div>
                <div>Lengde: <span id="profileLength">-</span></div>
            </div>
        </div>

        <div class="section geometry-section">
            <label for="geometryFiles">Geometrikilder</label>
            <input id="geometryFiles" type="file" accept=".ifc,.trb,.trimbim" multiple>
            <div class="geometry-help">Velg én eller flere IFC- og TRB-filer. Formatene kan brukes samtidig.</div>
            <div id="geometrySourceSummary">Ingen geometrifiler valgt</div>
            <div id="geometrySourceList"></div>
            <button id="btnClearGeometry" type="button" class="secondary-button">Fjern alle geometrifiler</button>
        </div>

        <div class="section">
            <label>Stasjon</label>
            <input type="number" id="stationInput" value="0" step="1">
            <input type="range" id="stationSlider" min="0" max="1000" value="0">
        </div>

        <div class="section">
            <div class="nav">
                <button id="minus10">-10m</button>
                <button id="minus1">-1m</button>
                <button id="plus1">+1m</button>
                <button id="plus10">+10m</button>
            </div>
        </div>

        <div class="section">
            <label>Snittbredde (m)</label>
            <input id="sectionWidth" type="number" value="50">
        </div>

        <div class="section">
            <button id="btnGenerate">Generer profil</button>
        </div>

        <div class="section">
            <button id="btnExportSvg">Eksporter SVG</button>
            <button id="btnExportPng">Eksporter PNG</button>
        </div>

        <div class="section">
            <label>Status</label>
            <div id="status">Klar</div>
        </div>
    </aside>

    <main id="viewer">
        <div id="header">
            <span>Tverrprofil</span>
            <span id="stationLabel">0.000</span>
        </div>
        <svg id="profileSvg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet"></svg>
    </main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
